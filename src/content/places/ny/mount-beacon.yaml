summary: A steep, popular climb to a restored fire tower with 360-degree views over the Hudson River and Highlands.
details: The route goes up a gravel road to the old incline railway, then up the Casino Trail. Most guides describe a round trip of about 4 miles with a few hours of steady climbing.
warnings:
  - type: crowds
    text: One of the most popular hikes in the region. Weekends and clear fall days are busy, and the parking area can fill.
    verify: true
  - type: safety
    text: The climb is steep and rocky. Bring water and good shoes, and check conditions after rain or in winter.
