summary: A famous gorge with about 19 waterfalls along a 1.5-mile trail of stone bridges, tunnels and steps.
details: The Gorge Trail is one of the best-known walks in the Finger Lakes. It climbs a lot of stone steps, so allow time and wear shoes with grip. Walk one way and return by the rim trail, or the reverse.
