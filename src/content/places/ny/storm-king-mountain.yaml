summary: A steep ridge hike above the Hudson River in the Hudson Highlands, with open ledges and river views.
details: Several loops are possible, from a shorter steep loop of about 2.5 miles to a longer one of about 4 miles. Trails are rocky and steep in places, so plan for a workout.
warnings:
  - type: parking
    text: Parking is limited and the park is undeveloped, with no toilets (per the official park description).
    verify: false
  - type: safety
    text: Stay on marked trails. There are warnings about unexploded shells from neighboring military land off the trails in the south part of the park.
    verify: true
  - type: other
    text: Dogs are allowed on a leash of no more than 6 feet.
    verify: false
