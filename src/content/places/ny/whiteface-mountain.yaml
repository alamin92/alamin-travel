summary: One of the Adirondack High Peaks (about 4,867 feet), with a scenic summit highway in warm months and a major ski area in winter.
details: In season, the Veterans Memorial Highway climbs most of the way up, and a short walk or an elevator leads to the summit for wide views. In winter it is a downhill ski area.
