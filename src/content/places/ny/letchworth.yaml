summary: 'Often called the "Grand Canyon of the East": a long Genesee River gorge with three major waterfalls and many overlooks.'
details: The park runs about 17 miles along the gorge, so you can drive between overlooks and short trails. Middle Falls, with its railroad bridge, is the classic stop. Hot-air balloon rides and whitewater rafting are offered by outside operators in season.
