summary: A mountain village on Mirror Lake that hosted the 1932 and 1980 Winter Olympics, with shops, restaurants and a base for High Peaks adventures.
details: A good home base for the Adirondack High Peaks. In town you can walk Main Street and Mirror Lake and see the Olympic sites. Many activities in the area are run by separate operators.
