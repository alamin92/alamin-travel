summary: A gorge with many waterfalls, including the 115-foot Lucifer Falls, and a swimming area in summer.
details: A gorge trail follows Enfield Creek past the falls on stone steps and bridges. A lower area has picnic spots and a seasonal swimming area, which makes it a relaxed family stop.
