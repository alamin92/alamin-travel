summary: A 215-foot waterfall, taller than Niagara Falls, at the end of a mostly flat gorge walk beside Cayuga Lake.
details: The gorge trail is a gentle walk of under a mile each way to the base of the falls, which suits kids and most ability levels. There is also an overlook you can reach from the rim, plus a beach, picnic areas and lake views.
