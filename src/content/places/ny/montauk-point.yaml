summary: The historic lighthouse at the very eastern tip of Long Island, with a museum, ocean views and short walks along the bluffs.
details: It is a long drive from most of Long Island, so make a day of it. The lighthouse dates to the 1790s, and the point is a popular stop for photos and sunrise.
