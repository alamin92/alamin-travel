summary: A large preserve on the Shawangunk Ridge with a glacial lake, cliff-top views, waterfalls and miles of easy carriage roads.
details: Much of it is wide, gentle carriage road, good for families. Harder rocky routes and cliff viewpoints are there for stronger hikers. It is one of the most popular outings in the Hudson Valley, so plan around crowds.
tips:
  - We could not get in on a fall weekend because the park was full. Go very early, go midweek, or have a backup such as the Walkway Over the Hudson.
warnings:
  - type: parking
    text: Lake Minnewaska and Sam's Point get heavy congestion on good-weather days and close for periods when the lots reach capacity. Roadside parking is prohibited and cars are ticketed and towed.
    verify: false
  - type: closure
    text: The park page says a section of the Lake Awosting Carriage Road is closed through 2026 for trail restoration.
