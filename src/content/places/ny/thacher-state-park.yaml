summary: A park on top of the Helderberg Escarpment, close to Albany, with cliff-edge views and the Indian Ladder Trail beneath the cliffs.
details: The easiest big-view stop near Albany, and a good fit for a free half day. The escarpment is rich in fossils, which are fun to look for but must be left where they are.
