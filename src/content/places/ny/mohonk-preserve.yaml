summary: A nonprofit preserve on the Shawangunk Ridge with cliff-top views, carriage roads and some of the region's best scrambles.
details: Popular routes include Gertrude's Nose and a rock-scramble route through narrow passages. Some routes are physically demanding and not suitable for everyone.
