summary: A just-under-5-mile round trip up an old carriage road to a historic fire tower, hotel ruins and wide views of the Hudson Valley and central Catskills.
details: The climb is steady, gaining roughly 1,400 feet, so it suits people comfortable with a long uphill. Allow a half day with time at the top.
warnings:
  - type: safety
    text: The DEC advises people to look at the old hotel ruins from the outside and not to enter, because they are unstable.
    verify: false
  - type: weather
    text: The summit is cooler and windier than the trailhead. Carry water and layers.
    verify: true
  - type: closure
    text: Fire tower access and the summit cabin depend on volunteer staffing and season. Check the DEC page.
    verify: true
